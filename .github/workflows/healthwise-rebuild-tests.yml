name: Healthwise Rebuild Unit Tests
on:
  push:
    branches:
      - 'rebuild/**'
    paths:
      - 'rebuild/**'
      - '.github/workflows/healthwise-rebuild-tests.yml'
  pull_request:
    paths:
      - 'rebuild/**'
      - '.github/workflows/healthwise-rebuild-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the allowlisted offline Engineering Vault artifact
        run: |
          node --check scripts/build-preview.mjs
          node --check scripts/smoke-built-preview.mjs
          npm run build:preview
      - name: Smoke the actual packaged preview on localhost
        run: npm run smoke:built
      - name: Report canonical legacy source readiness (read-only NO-GO)
        run: |
          node --check scripts/audit-canonical-source.mjs
          node scripts/audit-canonical-source.mjs
      - name: Run isolated dependency-free tests
        run: npm test
      - name: Verify real preview startup and forbidden routes on loopback
        run: |
          node --check scripts/smoke-preview.mjs
          node scripts/smoke-preview.mjs
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthwise_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: healthwise_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthwise_test -d healthwise_disposable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral PostgreSQL test driver
        run: npm install --no-save --package-lock=false pg stripe
      - name: Run rollback-only isolated PostgreSQL migration smoke test
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-integration.mjs
      - name: Run isolated two-connection PostgreSQL webhook concurrency test
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-concurrency.mjs
      - name: Run disposable PostgreSQL session-binding concurrency test
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-session-binding.mjs
      - name: Verify known-session recovery with disposable PostgreSQL and offline Stripe
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-known-session-recovery.mjs
      - name: Verify full discovery-to-recovery using disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-discovered-session-recovery.mjs
      - name: Verify v2 Checkout monetary reservation with disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-v2-monetary-reservation.mjs
      - name: Exercise signed offline Stripe webhook through disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-signed-stripe-e2e.mjs
      - name: Verify transactional session lifecycle in disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: |
          node --check src/integrations/vault-session-lifecycle.mjs
          node --check src/integrations/postgres-vault-session-store.mjs
          node --check test/postgres-vault-session-lifecycle.mjs
          node test/postgres-vault-session-lifecycle.mjs
      - name: Verify signed session ownership through disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: |
          node --check src/integrations/signed-session-verifier.mjs
          node --check src/integrations/postgres-session-reader.mjs
          node --check test/postgres-signed-owner-e2e.mjs
          node test/postgres-signed-owner-e2e.mjs
      - name: Verify read-only owner isolation with disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: |
          node --check src/integrations/postgres-owner-read-proof.mjs
          node --check test/postgres-owner-read-isolation.mjs
          node test/postgres-owner-read-isolation.mjs
      - name: Verify owner-bound Checkout reservation with disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-v2-owner-bound-reservation.mjs
      - name: Enforce immutable order ownership in disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-immutable-order-ownership.mjs
      - name: Syntax-check reviewer authorization integration before PostgreSQL execution
        run: |
          node --check src/integrations/stripe-v2-postgres-review-authorization.mjs
          node --check src/integrations/stripe-v2-review-revocation.mjs
          node --check test/postgres-review-restricted-adapter.mjs
      - name: Verify server-owned administrator session and grant reader with disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: |
          node --check test/postgres-review-admin-session-dependencies.mjs
          node test/postgres-review-admin-session-dependencies.mjs
      - name: Verify reviewer adapter with dedicated non-superuser PostgreSQL login
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: |
          node --check test/postgres-review-dedicated-login.mjs
          node test/postgres-review-dedicated-login.mjs
      - name: Verify SECURITY DEFINER revocation permissions in disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: |
          node --check test/postgres-review-revocation-function.mjs
          node test/postgres-review-revocation-function.mjs
      - name: Verify actual reviewer adapter under SELECT-only PostgreSQL permissions
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-review-restricted-adapter.mjs
      - name: Verify SELECT-only reviewer privilege isolation in disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-review-privilege-negative.mjs
      - name: Verify reviewer grant revocation serialization in disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-review-authorization-race.mjs
      - name: Verify immutable v2 Checkout request snapshot in disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-v2-request-snapshot.mjs
      - name: Verify full Checkout request and URLs with disposable PostgreSQL
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
        run: node test/postgres-v2-full-request-fingerprint.mjs
  disposable-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthwise_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: healthwise_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthwise_test -d healthwise_disposable"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create second disposable restore database
        env:
          PGPASSWORD: disposable_ci_only
        run: createdb -h 127.0.0.1 -p 5432 -U healthwise_test healthwise_restore_disposable
      - name: Syntax-check disposable recovery script
        run: bash -n test/disposable-backup-restore.sh
      - name: Exercise synthetic backup and isolated restore
        env:
          HEALTHWISE_ISOLATED_DB_ACK: YES_DISPOSABLE_DB
          HEALTHWISE_TEST_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_disposable
          HEALTHWISE_RESTORE_DATABASE_URL: postgres://healthwise_test:disposable_ci_only@127.0.0.1:5432/healthwise_restore_disposable
        run: bash test/disposable-backup-restore.sh
  stripe-sdk-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral official Stripe SDK
        run: npm install --no-save --package-lock=false stripe
      - name: Verify real SDK webhook signature using offline synthetic event
        run: node test/stripe-sdk-signature.mjs
      - name: Verify signed HTTP delivery on isolated loopback using real Stripe SDK
        run: node test/stripe-sdk-loopback-http.mjs
